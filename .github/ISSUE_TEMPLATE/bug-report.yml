name: Bug report
description: Report a feature of EraseMC Core not working as expected
body:
  - type: markdown
    attributes:
      value: |
        ## Plugin information

        > [!IMPORTANT]
        > It's strongly recommended to test for bugs without plugins before reporting an issue.
        > This helps avoid wasting maintainers' time on bugs that are not actually caused by EraseMC Core.
        >
        > If you're not sure whether a plugin might be causing your issue, describe what you tested in the issue below.

  - type: dropdown
    attributes:
      label: Plugin information
      options:
        - "I haven't tested without plugins"
        - Bug happens without plugins
        - Bug only happens with certain plugins (describe below)
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Bug description

        > [!TIP]
        > Helpful information to include:
        > - Steps to reproduce the issue
        > - Error backtraces
        > - Crashdumps
        > - Plugin code that triggers the issue
        > - List of installed plugins (use /plugins)

        > [!IMPORTANT]
        > **Steps to reproduce are critical to finding the cause of the problem!**
        > Without reproducing steps, the issue will probably not be solvable and may be closed.
        
        > [!IMPORTANT]
        > While we accept AI-generated reports, you must follow these guidelines before submitting:
        > - Verify for yourself that the issue is reproducible and not a false positive.
        > - You must provide in-game tests or test code to reproduce so that maintainers do not waste time trying to reproduce the issue themselves.
        > - If applicable, provide the prompt you used to generate the report.
        > Failure to follow these guidelines may result in your issue being closed.

  - type: textarea
    attributes:
      label: Problem description
      description: Describe the problem, and how you encountered it
      placeholder: e.g. Steps to reproduce the issue
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Version, OS and game info
        > [!WARNING]
        > "Latest" is not a valid version.
        > Failure to fill these fields with valid information may result in your issue being closed.

  - type: input
    attributes:
      label: EraseMC Core version
      placeholder: Use the /version command in EraseMC Core
    validations:
      required: true
  - type: input
    attributes:
      label: PHP version
      placeholder: e.g. PHP 8.3.12
    validations:
      required: true
  - type: input
    attributes:
      label: Server OS
      placeholder: e.g. Ubuntu 24.04 x86_64
    validations:
      required: true
  - type: input
    attributes:
      label: Game version (if applicable)
      placeholder: e.g. Minecraft Bedrock 1.21.80 on Android
    validations:
      required: false
