name: Crash
description: Report a crash in Erase-PocketMine-MP (not plugins)
title: Server crashed
body:
  - type: markdown
    attributes:
      value: |
        > [!CAUTION]
        > If the crash can be triggered over the network (e.g. by a player / hack client), DO NOT report it here.
        > 
        > Read our [Security Policy](https://github.com/EraseMC/PocketMine-MP/blob/stable/SECURITY.md) first.

        > [!TIP]
        > Don't paste raw crashdump data into the issue.
        >
        > The EraseMC crash archive is not enabled yet. Attach the crashdump `.log` file directly to this issue, after removing sensitive information.

  - type: textarea
    id: crashdump
    attributes:
      label: Crashdump log
      description: Attach the sanitized crashdump .log file or provide a private link.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Additional comments (optional)
      description: Any other information that might help us solve the problem
