name: 'Manage support request issues'

on:
  issues:
    types: [labeled, unlabeled, reopened]

jobs:
  support:
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/support-requests@v5
        with:
          github-token: ${{ github.token }}
          support-label:  "Support request"
          issue-comment: >
            Hi, we only accept **bug reports** on this issue tracker, but this issue looks like a support request.


            Instead of creating an issue, try the following:

            - Check the repository [README](https://github.com/${{ github.repository }}#readme) and [Building guide](https://github.com/${{ github.repository }}/blob/stable/BUILDING.md)

            - Ask a question in a discussion if GitHub Discussions are enabled for this repository

          close-issue: true
          lock-issue: false
