#==============================================================================#
#                     Erase-PocketMine-MP main configuration                   #
#==============================================================================#
#
# Settings which cannot be set in server.properties.
# Most of them are safe to change; some can break your server if set wrong.
# New settings are NOT added to this file automatically when you update the
# server: compare with the default file in each release's changelog.

#------------------------------------------------------------------------------#
# Multi-version: which Minecraft: Bedrock Edition versions may join
#------------------------------------------------------------------------------#
multiversion:
  # Lowest and highest Minecraft version allowed to join, for example "1.16.100"
  # or "1.21.0". Patch releases are matched to their protocol, so "1.16.101"
  # means the same as "1.16.100". Leave empty ("") for no limit.
  minimum-version: ""
  maximum-version: ""

  # Versions which may never join, even though the server supports them.
  # Each entry is one of:
  #   - a Minecraft version,      e.g. "1.16.200"
  #   - a whole release line,     e.g. "1.16"   (every 1.16.x version)
  #   - a network protocol number, e.g. 422
  # The defaults are 1.16 releases which have not been tested with a real client
  # yet. Remove an entry at your own risk to let that version join.
  blocked-versions:
    - "1.16.0"   # 1.16.0, 1.16.1, 1.16.10
    - "1.16.20"  # 1.16.20, 1.16.40
    - "1.16.200" # 1.16.200, 1.16.201
    - "1.16.210"
    - "1.16.220" # 1.16.220, 1.16.221

  # Message shown to players whose version may not join.
  # Leave empty ("") to show the game's standard "outdated client/server" screen.
  kick-message: ""

#------------------------------------------------------------------------------#
# General
#------------------------------------------------------------------------------#
settings:
  # Send all messages translated into the server language instead of letting
  # each client translate them.
  force-language: false
  shutdown-message: "Server closed"
  # Allow listing plugins via Query.
  query-plugins: true
  # Enable plugin and core profiling by default.
  enable-profiling: false
  # Only add profiling results when the tick measurement is below or equal to
  # this value (default 20).
  profile-report-trigger: 20
  # Number of AsyncTask workers, used for plugin asynchronous tasks, world
  # generation, compression and web communication. Set this to roughly your
  # number of CPU cores; "auto" detects them (or uses 2).
  async-workers: auto
  # Allow running development builds. They might crash, break your plugins or
  # corrupt your worlds; avoid them where possible.
  enable-dev-builds: false

#------------------------------------------------------------------------------#
# Memory
#------------------------------------------------------------------------------#
memory:
  # Global soft memory limit in megabytes (0 to disable). Exceeding it fires the
  # low-memory triggers and an event to free memory.
  global-limit: 0

  # Main thread soft memory limit in megabytes (0 to disable). Exceeding it fires
  # the low-memory triggers and an event to free memory.
  main-limit: 0

  # Main thread hard memory limit in megabytes (0 to disable). Exceeding it
  # stops the server.
  main-hard-limit: 1024

  # Hard memory limit of each AsyncWorker thread in megabytes (0 to disable).
  # A task exceeding it crashes on that worker.
  # NOTE: THIS LIMIT APPLIES PER WORKER, NOT TO THE WHOLE PROCESS.
  async-worker-hard-limit: 256

  # How often to check memory usage, in ticks (default 1 second).
  check-rate: 20

  # Keep firing the low-memory triggers and event while memory stays low.
  continuous-trigger: true

  # With continuous-trigger enabled: how often to fire them, in check-rate
  # steps (default 30 seconds).
  continuous-trigger-rate: 30

  garbage-collection:
    # How often to run the garbage collector manually, in ticks (default 30
    # minutes; 0 to disable). Only affects the main thread.
    period: 36000

  memory-dump:
    # Dump memory of async workers as well as the main thread. Disable this if
    # memory dumps cause segfaults.
    dump-async-worker: true

  max-chunks:
    # Maximum render distance per player while memory is low (0 to disable).
    chunk-radius: 4

#------------------------------------------------------------------------------#
# Network
#------------------------------------------------------------------------------#
network:
  # Packets larger than this many bytes are compressed.
  # 0 compresses everything, -1 disables compression.
  batch-threshold: 256
  # Compression level for batched packets. Higher uses more CPU and less
  # bandwidth.
  compression-level: 6
  # Compress on AsyncTasks during the game session. Adds latency, but may reduce
  # main thread load.
  async-compression: false
  # Only packets larger than this many bytes are compressed asynchronously; the
  # AsyncTask overhead is only worth it for large packets.
  async-compression-threshold: 10000
  # Experimental: forward the server port automatically with UPnP.
  upnp-forwarding: false
  # Maximum size of packets sent over the network, in bytes (default 1492).
  # Larger packets are split. Clients may request MTU sizes up to this value.
  max-mtu-size: 1492
  # Encrypt Minecraft network traffic. This costs some performance, but stops
  # attackers from stealing sessions and impersonating players.
  # DO NOT DISABLE THIS unless you understand the risks involved.
  enable-encryption: true

#------------------------------------------------------------------------------#
# Debugging
#------------------------------------------------------------------------------#
debug:
  # Show debug messages in the console when greater than 1.
  level: 1

#------------------------------------------------------------------------------#
# Players
#------------------------------------------------------------------------------#
player:
  # Save player data (inventory, position, ...).
  save-player-data: true
  # Check that joining players' Xbox user ID (XUID) matches the recorded one.
  # This also stops players without Xbox Live from using an Xbox Live player's
  # name to steal their data on servers with xbox-auth=off.
  verify-xuid: true

#------------------------------------------------------------------------------#
# Worlds and chunks
#------------------------------------------------------------------------------#
level-settings:
  # Format used for newly created worlds.
  default-format: leveldb
  # Entities below this Y level take void damage (default 0).
  min-y: 0

chunk-sending:
  # The normal render distance is view-distance in server.properties.
  # Chunks sent to each player per tick.
  per-tick: 4
  # Radius of chunks which must be sent before a player spawns.
  spawn-radius: 4

chunk-ticking:
  # Radius of chunks around a player which are ticked.
  tick-radius: 3
  # Blocks randomly ticked per subchunk each tick. Higher values speed up tree
  # and plant growth at a higher performance cost.
  blocks-per-subchunk-per-tick: 3
  # IDs of blocks which are not randomly ticked.
  disable-block-ticking:
    #- grass
    #- ice
    #- fire

chunk-generation:
  # Maximum number of chunks waiting to be populated.
  population-queue-size: 32

ticks-per:
  autosave: 6000

worlds:
  # Overrides the generator set in server.properties and allows loading
  # multiple worlds. Example:
  #world:
  # seed: 404
  # generator: FLAT
  # preset: 2;bedrock,59xstone,3xdirt,grass;1

#------------------------------------------------------------------------------#
# Reporting, statistics and updates
#------------------------------------------------------------------------------#
auto-report:
  # Send crash reports for processing.
  # Disabled until EraseMC operates its own crash archive endpoint.
  enabled: false
  send-code: true
  send-settings: true
  send-phpinfo: false
  use-https: true
  host: crash.erasemc.invalid

anonymous-statistics:
  # Send anonymous statistics for data aggregation and plugin usage tracking.
  # Disabled until EraseMC operates its own statistics endpoint.
  enabled: false
  host: stats.erasemc.invalid

auto-updater:
  # Disabled until EraseMC operates its own update API endpoint.
  enabled: false
  on-update:
    warn-console: true
  # One of development, alpha, beta or stable.
  preferred-channel: stable
  # Suggest changing the channel when running a development version.
  suggest-channels: true
  host: updates.erasemc.invalid

timings:
  # Host used for viewing timings results.
  host: timings.erasemc.invalid

#------------------------------------------------------------------------------#
# Console
#------------------------------------------------------------------------------#
console:
  # Accept commands typed in the console. When disabled, console input is
  # ignored; useful on headless servers (hosting, Docker, ...).
  enable-input: true
  # Show server statistics in the console title.
  # NOTE: this is disabled anyway when console colours are disabled.
  title-tick: true

#------------------------------------------------------------------------------#
# Command aliases
#------------------------------------------------------------------------------#
aliases:
  ## Add, remove or remap command aliases here. One alias may run one or more
  ## other commands (or aliases). Aliases defined here override those declared
  ## by plugins or the server itself.

  ## Remove an alias by setting it to [] (prefixed aliases such as
  ## "pocketmine:stop" remain and cannot be removed):
  #stop: []

  ## Commands are never removed, only their aliases: the full prefixed name
  ## ("pocketmine:commandname" or "pluginname:commandname") always works.
  #abort: [pocketmine:stop]

  ## Add an alias by listing the command(s) it runs:
  #showtheversion: [version]
  #savestop: [save-all, stop]

  ## Pass arguments on with $1, $2, ...:
  #giveadmin: [op $1] ## `giveadmin alex` -> `op alex`
  #kill: [suicide, say "I tried to kill $1"] ## `kill alex` -> `suicide` + `say "I tried to kill alex"`
  #giverandom: [give $1 $2, say "Someone has just received a $2!"] ## `giverandom alex diamond` -> `give alex diamond` + `say "Someone has just received a diamond!"`

  ## Make an argument mandatory with $$ (the command fails without it):
  #makeadmin: [op $$1] ## `makeadmin alex` -> `op alex`, `makeadmin` with no arguments = error

  ## Pass a range of arguments with a trailing hyphen:
  #tpalias: [tp $1-] ## `tpalias 256 70 256` -> `tp 256 70 256`

  ## Make an existing alias do something else:
  #tp: [suicide]

#------------------------------------------------------------------------------#
# Plugins
#------------------------------------------------------------------------------#
plugins:
  # Use the legacy layout which keeps plugin data inside the --plugins
  # directory. When false, plugin data is stored in plugin_data under --data.
  # Kept for existing installations.
  legacy-data-dir: false
